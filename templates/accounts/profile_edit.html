{% extends "base.html" %}
{% block title %}Edit profile | GapGo{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Edit profile</h2>
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn">Save changes</button>
    <a class="btn btn-outline" href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
</div>
{% endblock %}
