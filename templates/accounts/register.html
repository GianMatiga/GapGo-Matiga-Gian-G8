{% extends "base.html" %}
{% block title %}Sign up | GapGo{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Create your account</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn full">Sign up</button>
  </form>
  <p class="muted center">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div>
{% endblock %}
