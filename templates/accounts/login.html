{% extends "base.html" %}
{% block title %}Log in | GapGo{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Log in</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn full">Log in</button>
  </form>
  <p class="muted center">New to GapGo? <a href="{% url 'accounts:register' %}">Create an account</a></p>
</div>
{% endblock %}
